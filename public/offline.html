<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — TEDxAlFalah Youth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .container { max-width: 420px; }
    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    .red { color: #E62B1E; }
    .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .ar { direction: rtl; }
    p { color: #888; line-height: 1.8; font-size: 0.95rem; }
    p + p { margin-top: 0.25rem; }
    .divider { width: 2rem; height: 2px; background: #222; margin: 1.25rem auto; border-radius: 1px; }
    button {
      margin-top: 1.5rem;
      background: #E62B1E;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c7261a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#x26A0;&#xFE0F;</div>
    <h1>TED<span class="red">x</span>AlFalah Youth</h1>
    <p class="ar">أنت غير متصل بالإنترنت</p>
    <p>You're currently offline</p>
    <div class="divider"></div>
    <p class="ar">يرجى التحقق من اتصالك والمحاولة مرة أخرى</p>
    <p>Please check your connection and try again</p>
    <button onclick="window.location.reload()">Try Again / حاول مرة أخرى</button>
  </div>
</body>
</html>
